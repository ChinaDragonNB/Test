<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="一页式产品首页，展示你的想法、作品和下一步行动。"
    />
    <title>拾光 · 让好想法发生</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17212b;
        --muted: #63707c;
        --paper: #f7f8f4;
        --card: rgba(255, 255, 255, 0.78);
        --line: rgba(23, 33, 43, 0.1);
        --accent: #ee7651;
        --accent-dark: #c95736;
        --mint: #d7eee5;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background:
          radial-gradient(circle at 88% 12%, #f8d7b8 0, transparent 24%),
          radial-gradient(circle at 4% 86%, #d8eee4 0, transparent 26%),
          var(--paper);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.6;
      }

      .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 0;
      }

      .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 0.08em; }
      .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; color: white; background: var(--accent); border-radius: 12px 12px 12px 4px; }
      nav { display: flex; gap: 28px; color: var(--muted); font-size: 14px; }
      nav a { color: inherit; text-decoration: none; }
      nav a:hover { color: var(--accent-dark); }

      .hero { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 72px; align-items: center; padding: 72px 0 96px; }
      .eyebrow { margin: 0 0 18px; color: var(--accent-dark); font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
      h1 { max-width: 620px; margin: 0; font-size: clamp(48px, 7vw, 84px); line-height: 1.04; letter-spacing: -0.06em; }
      .lead { max-width: 500px; margin: 26px 0 34px; color: var(--muted); font-size: 18px; }
      .actions { display: flex; flex-wrap: wrap; gap: 14px; }
      .button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border: 1px solid transparent; border-radius: 999px; color: white; background: var(--ink); font-size: 15px; font-weight: 700; text-decoration: none; }
      .button:hover { background: var(--accent-dark); }
      .button.secondary { color: var(--ink); border-color: var(--line); background: rgba(255,255,255,.5); }

      .visual { position: relative; min-height: 440px; }
      .orb { position: absolute; inset: 32px 10px 0 44px; overflow: hidden; border-radius: 42% 58% 52% 48% / 45% 42% 58% 55%; background: linear-gradient(145deg, #f7b281, #ee7651 56%, #c95736); box-shadow: 24px 28px 60px rgba(201, 87, 54, .2); transform: rotate(-7deg); }
      .orb::after { position: absolute; width: 240px; height: 240px; content: ""; right: -44px; bottom: -56px; border: 34px solid rgba(255,255,255,.28); border-radius: 50%; }
      .note { position: absolute; display: flex; flex-direction: column; justify-content: space-between; width: 196px; height: 238px; padding: 22px; border: 1px solid rgba(255,255,255,.64); border-radius: 20px; color: white; background: rgba(23,33,43,.82); box-shadow: 0 20px 40px rgba(23,33,43,.16); transform: rotate(8deg); }
      .note.top { top: 20px; right: 12px; }
      .note.bottom { bottom: 20px; left: 0; padding: 18px; background: var(--mint); color: var(--ink); transform: rotate(-8deg); }
      .note small { opacity: .68; font-size: 12px; }
      .note strong { font-size: 22px; line-height: 1.2; }
      .note span { font-size: 12px; opacity: .72; }

      .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding-bottom: 72px; }
      .feature { padding: 26px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); backdrop-filter: blur(10px); }
      .feature-icon { display: grid; width: 38px; height: 38px; margin-bottom: 18px; place-items: center; border-radius: 12px; background: var(--mint); }
      .feature h2 { margin: 0 0 8px; font-size: 19px; }
      .feature p { margin: 0; color: var(--muted); font-size: 14px; }

      footer { display: flex; justify-content: space-between; padding: 26px 0 34px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

      @media (max-width: 760px) {
        .shell { width: min(100% - 28px, 560px); }
        nav { display: none; }
        .hero { grid-template-columns: 1fr; gap: 30px; padding: 52px 0 64px; }
        .visual { min-height: 360px; }
        .features { grid-template-columns: 1fr; padding-bottom: 48px; }
        footer { flex-direction: column; gap: 8px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="./" aria-label="拾光首页"><span class="brand-mark">✦</span>拾光</a>
        <nav aria-label="主导航">
          <a href="#about">关于我们</a>
          <a href="#features">亮点</a>
          <a href="#start">开始探索</a>
        </nav>
      </header>

      <main>
        <section class="hero" id="start">
          <div>
            <p class="eyebrow">Make room for good ideas</p>
            <h1>把灵感，变成正在发生的事。</h1>
            <p class="lead">拾光是一个留给好想法的轻盈空间。记录、整理，再向前一步，让每一次心动都有落脚点。</p>
            <div class="actions">
              <a class="button" href="#features">看看亮点 <span aria-hidden="true">→</span></a>
              <a class="button secondary" href="#about">了解拾光</a>
            </div>
          </div>

          <div class="visual" aria-label="拾光产品概念展示">
            <div class="orb"></div>
            <div class="note top"><small>今日灵感  /  09:42</small><strong>先做一个<br />小小的开始。</strong><span>无需完美，先让它发生。</span></div>
            <div class="note bottom"><small>收藏夹</small><strong>12 个<br />好点子</strong><span>持续生长中 ↗</span></div>
          </div>
        </section>

        <section class="features" id="features" aria-label="产品亮点">
          <article class="feature"><div class="feature-icon">✎</div><h2>随手记录</h2><p>抓住一闪而过的灵感，把重要的念头留在当下。</p></article>
          <article class="feature"><div class="feature-icon">⌁</div><h2>自然整理</h2><p>让零散的想法慢慢连成线，找到真正值得投入的方向。</p></article>
          <article class="feature" id="about"><div class="feature-icon">↗</div><h2>轻松出发</h2><p>从一个小行动开始，把想象中的未来带到今天。</p></article>
        </section>
      </main>

      <footer><span>© 2026 拾光</span><span>给生活留一点想象力。</span></footer>
    </div>
  </body>
</html>
